repos:
  - repo: local
    hooks:
      - id: architecture-check
        name: Architecture constraints
        entry: python lints/check_architecture.py
        language: system
        pass_filenames: false
        always_run: true

      - id: no-print-statements
        name: No bare print() in src/
        entry: python lints/check_no_print.py
        language: system
        pass_filenames: false
        types: [python]

      - id: update-agents-md
        name: Sync AGENTS.md navigation
        entry: python scripts/gc_update_agents_md.py
        language: system
        pass_filenames: false
        files: ^docs/

  # Standard community hooks — uncomment as needed
